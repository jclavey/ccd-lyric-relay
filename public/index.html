<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCD Lyrics Relay</title>
  <style>
    /* -----------------------------------------------------------------------
       Reset & base
    ----------------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;

      /* System fonts only, so nothing has to load over the network. */
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }

    /* -----------------------------------------------------------------------
       Layout: one full-screen flex container
    ----------------------------------------------------------------------- */
    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 4vw;           /* breathing room at the edges */
    }

    /* -----------------------------------------------------------------------
       Lyrics container
       Each .line is one text element from the slide.
    ----------------------------------------------------------------------- */
    #lyrics {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25em;            /* relative gap — scales with font size */
      transition: opacity 0.4s ease;
    }

    .line {
      /*
       * white-space: nowrap is essential — it prevents the browser
       * from wrapping the line, so our resize logic can measure the
       * true single-line width and shrink the font to fit.
       */
      white-space: nowrap;
      line-height: 1.15;
      text-align: center;
      width: 100%;

      /*
       * Subtle transition so a font-size change caused by a new slide
       * doesn't feel like a hard jump.
       */
      transition: font-size 0.15s ease;
    }

    /* Allow wrapping for scripture lines */
    .line.wrap {
      white-space: normal;
      word-break: break-word;
      hyphens: auto;
    }

    /* -----------------------------------------------------------------------
       Status overlay — shown when disconnected or waiting for content
    ----------------------------------------------------------------------- */
    #status {
      position: fixed;
      bottom: 2vh;
      left: 50%;
      transform: translateX(-50%);

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(10px, 1.5vw, 14px);
      color: rgba(255, 255, 255, 0.18);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;

      transition: opacity 0.5s ease;
    }

    #status.hidden {
      opacity: 0;
    }

    /* Connection dots are only shown with ?debug in the URL */
    #connection-status, #inbound_connection-status {
      display: none;
      position: fixed;
      top: 2vh;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    #connection-status {
      left: 4vh;  
    }

    #inbound_connection-status {
      left: 2vh;
    }

    body.debug #connection-status, body.debug #inbound_connection-status {
      display: block;
    }

    #connection-status.disconnected, #inbound_connection-status.disconnected {
      background: red;
    }

    #connection-status.connected, #inbound_connection-status.connected {
      background: green;
    }

    /* -----------------------------------------------------------------------
       Blanked state — when audience screens are disabled in ProPresenter
    ----------------------------------------------------------------------- */
    body.blanked #lyrics,
    body.blanked #reference,
    body.blanked #reference-bar {
      opacity: 0;
    }

    body.cleared #lyrics {
      display: none;
    }

    /* Keep Scripture text clear of the reference bar at the bottom */
    body.scripture #stage {
      padding-bottom: 18vh;
    }

    /* -----------------------------------------------------------------------
       Waiting message — shown when no service is being broadcast
    ----------------------------------------------------------------------- */
    #waiting {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: normal;
      font-size: clamp(16px, 3vw, 28px);
      color: rgba(255, 255, 255, 0.4);
      transition: opacity 0.5s ease;
    }

    #waiting.hidden {
      opacity: 0;
    }

    /* Scripture reference shown at bottom of the page */
    #reference-bar {
      position: fixed;
      bottom: 13vh;
      width: 80%;
      border-top: 3px solid white;
      transition: opacity 0.2s ease;
    }
    #reference {
      position: fixed;
      bottom: 6vh; /* above the status element */
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(18px, 6vw, 48px);
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.9);
      pointer-events: none;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    #reference-bar.hidden {
      opacity: 0;
    }

    #reference.hidden {
      opacity: 0;
    }
  </style>
</head>
<body class="blanked">

  <div id="stage">
    <div id="connection-status"></div>
    <div id="inbound_connection-status"></div>
    <div id="lyrics"></div>
    <div id="reference-bar" class="hidden"></div>
    <div id="reference" class="hidden"></div>
  </div>

  <div id="waiting" class="hidden">Lyrics will appear when the service starts</div>

  <div id="status">Connecting…</div>

  <script>
    // -------------------------------------------------------------------------
    // DOM refs
    // -------------------------------------------------------------------------
    const lyricsEl = document.getElementById('lyrics');
    const statusEl = document.getElementById('status');
    const stageEl  = document.getElementById('stage');
    const connectionStatusEl = document.getElementById('connection-status');
    const inboundConnectionStatusEl = document.getElementById('inbound_connection-status');
    const referenceEl = document.getElementById('reference');
    const referenceBarEl = document.getElementById('reference-bar');
    const waitingEl = document.getElementById('waiting');

    // Add ?debug to the URL to show the connection status dots.
    document.body.classList.toggle('debug', new URLSearchParams(location.search).has('debug'));

    // -------------------------------------------------------------------------
    // Font sizing
    //
    // Strategy: set every line to the same font size, determined by whichever
    // line is the longest (i.e. would overflow first). We binary-search for
    // the largest font size (in px) where the widest line still fits within
    // the stage width.
    //
    // We use a hidden off-screen <span> as a probe so we can measure text
    // width without affecting the live layout.
    // -------------------------------------------------------------------------
    const probe = document.createElement('span');
    probe.style.cssText = [
      'position:absolute',
      'top:-9999px',
      'left:-9999px',
      'white-space:nowrap',
      'visibility:hidden',
      `font-family:${getComputedStyle(document.body).fontFamily}`,
    ].join(';');
    document.body.appendChild(probe);

    /**
     * Measure how wide a string would render at a given font size (px).
     * @param {string} text
     * @param {number} sizePx
     * @returns {number} width in pixels
     */
    function measureWidth(text, sizePx) {
      probe.style.fontSize = sizePx + 'px';
      probe.textContent = text;
      return probe.getBoundingClientRect().width;
    }

    /**
     * Find the largest integer font size (px) at which ALL lines fit within
     * `maxWidth` without wrapping.
     *
     * @param {string[]} lines
     * @param {number}   maxWidth   — available width in px (stage minus padding)
     * @param {number}   maxHeight  — available height in px
     * @param {number}   lineCount  — number of lines (to factor in height)
     * @returns {number} font size in px
     */
    function fitFontSize(lines, maxWidth, maxHeight, lineCount) {
      if (!lines.length) return 16;

      // Upper bound: if there's only one short line it could theoretically be
      // enormous — cap at something visually sane.
      let lo = 8;
      let hi = 800;

      // Estimate height per line ≈ fontSize * lineHeight * lineCount + gaps.
      // gap is 0.25em between lines → (lineCount - 1) * 0.25 * fontSize
      // Total height ≈ fontSize * (lineCount * 1.15 + (lineCount - 1) * 0.25)
      const heightFactor = lineCount * 1.15 + Math.max(0, lineCount - 1) * 0.25;

      while (lo < hi) {
        const mid = Math.floor((lo + hi + 1) / 2);

        const widthOk  = lines.every(l => measureWidth(l, mid) <= maxWidth);
        const heightOk = (mid * heightFactor) <= maxHeight;

        if (widthOk && heightOk) {
          lo = mid;
        } else {
          hi = mid - 1;
        }
      }

      return lo;
    }

    /**
     * Find the largest font size (px) at which the lines, wrapped, fit within
     * `maxHeight`. Renders into the live container to measure the real
     * wrapped height, so call it before filling the container for display.
     */
    function fitWrappedFontSize(lines, maxHeight, minSize) {
      let lo = minSize;
      let hi = 200;

      while (lo < hi) {
        const mid = Math.floor((lo + hi + 1) / 2);
        fillLines(lines, mid, true);

        if (lyricsEl.scrollHeight <= maxHeight) {
          lo = mid;
        } else {
          hi = mid - 1;
        }
      }

      return lo;
    }

    function fillLines(lines, sizePx, wrap) {
      lyricsEl.innerHTML = '';
      lines.forEach(text => {
        const div = document.createElement('div');
        div.className = wrap ? 'line wrap' : 'line';
        div.style.fontSize = sizePx + 'px';
        div.textContent = text;
        lyricsEl.appendChild(div);
      });
    }

    /**
     * Re-render the current lines at the optimal font size.
     * Called whenever the slide changes OR the window is resized.
     *
     * opts.wrap    — allow lines to wrap (Scripture) and fit by height instead
     * opts.minSize — smallest font size to use when wrapping
     */
    let currentLines = [];
    let currentOpts = {};

    function renderLines(lines, opts = {}) {
      const { wrap = false, minSize = 8 } = opts;
      currentLines = lines;
      currentOpts = opts;

      if (!lines.length) {
        lyricsEl.innerHTML = '';
        return;
      }

      // Available space inside the stage padding
      const style = getComputedStyle(stageEl);
      const maxWidth  = stageEl.clientWidth  - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const maxHeight = stageEl.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);

      if (wrap) {
        fillLines(lines, fitWrappedFontSize(lines, maxHeight, minSize), true);
      } else {
        fillLines(lines, fitFontSize(lines, maxWidth, maxHeight, lines.length), false);
      }
    }

    // Re-fit on window resize (e.g. phone rotated, browser resized)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderLines(currentLines, currentOpts), 80);
    });

    // -------------------------------------------------------------------------
    // Status helper
    // -------------------------------------------------------------------------
    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.remove('hidden');
    }

    function hideStatus() {
      statusEl.classList.add('hidden');
    }

    // -------------------------------------------------------------------------
    // WebSocket connection
    // -------------------------------------------------------------------------
    const RECONNECT_DELAY_MS = 3000;

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${protocol}://${location.host}`;
      setStatus('Connecting…');

      const ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        setStatus('Connected');
        // Hide the status indicator after a short moment so it doesn't
        // distract when content is visible
        setTimeout(hideStatus, 2000);
      });

      ws.addEventListener('message', (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          console.warn('Could not parse message:', event.data);
          return;
        }

        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        setStatus(`Reconnecting in ${RECONNECT_DELAY_MS / 1000}s…`);
        setTimeout(connect, RECONNECT_DELAY_MS);
      });

      ws.addEventListener('error', () => {
        // 'close' will fire immediately after, which handles reconnect
        setStatus('Connection error');
      });
    }

    // -------------------------------------------------------------------------
    // Message handlers — one per message type from display-server.js
    // -------------------------------------------------------------------------
    const handlers = {
      inbound_connection_status(msg) {
        inboundConnectionStatusEl.classList.remove('connected', 'disconnected');
        inboundConnectionStatusEl.classList.add(msg.status);
      },
      /**
       * inbound_event — wraps the v2 `state` payload from
       * ccd-propresenter-bridge:
       *   { type, version, timestamp, look, presentation, slide: { lines },
       *     audienceScreensEnabled, proPresenterConnected }
       */
      inbound_event(eventJson) {
        const msg = eventJson.payload;

        // No payload: nothing is being broadcast (not started yet, or the
        // bridge has been gone longer than the relay's grace period).
        if (!msg) {
          showWaiting();
          return;
        }
        if (msg.type !== 'state') return;
        if (msg.version !== 2) {
          console.warn('Unsupported state payload version:', msg.version);
          return;
        }

        const isScripture = msg.look === 'Scripture';

        // Audience screens (null = not yet known). Applied before rendering;
        // the page starts blanked so a first slide with screens off never
        // fades out from full opacity.
        document.body.classList.toggle('blanked', msg.audienceScreensEnabled === false);

        // Look (cleared vs song/scripture); leave as-is until a look is known.
        // Applied before rendering so text is measured while visible.
        if (msg.look) {
          document.body.classList.toggle('cleared', msg.look !== 'Song' && msg.look !== 'Scripture');
        }

        // Slide content (lyrics / clear). For Scripture, first line is the
        // reference shown at the bottom; remaining lines are rendered as body.
        const lines = msg.slide?.lines ?? [];
        document.body.classList.toggle('scripture', isScripture && lines.length > 0);
        if (isScripture && lines.length) {
          referenceEl.textContent = lines[0];
          referenceEl.classList.remove('hidden');
          referenceBarEl.classList.remove('hidden');
          renderLines(lines.slice(1), { wrap: true, minSize: 20 });
        } else {
          referenceEl.textContent = '';
          referenceEl.classList.add('hidden');
          referenceBarEl.classList.add('hidden');
          renderLines(lines);
        }
        hideStatus();
        waitingEl.classList.add('hidden');

        // Presentation / song metadata (logged for now)
        if (msg.presentation) {
          console.log('Presentation:', msg.presentation.name);
        }

        // ProPresenter connection status
        connectionStatusEl.classList.remove('connected', 'disconnected');
        connectionStatusEl.classList.add(msg.proPresenterConnected ? 'connected' : 'disconnected');
      }
    };

    function showWaiting() {
      renderLines([]);
      referenceEl.textContent = '';
      referenceEl.classList.add('hidden');
      referenceBarEl.classList.add('hidden');
      document.body.classList.remove('cleared', 'scripture');
      document.body.classList.add('blanked');
      connectionStatusEl.classList.remove('connected', 'disconnected');
      waitingEl.classList.remove('hidden');
    }

    function handleMessage(msg) {
      const handler = handlers[msg.type];
      if (handler) {
        handler(msg);
      } else {
        console.log('Unhandled message type:', msg.type, msg);
      }
    }

    // -------------------------------------------------------------------------
    // Start
    // -------------------------------------------------------------------------
    connect();
  </script>
</body>
</html>
